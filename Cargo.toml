[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/main-service",
    "crates/messaging",
    "crates/file-storage",
    "crates/chat-filter",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/fromchat-messenger/backend"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
http = "1"
http-body = "1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
crypto_box = "0.9"
hkdf = "0.12"
hex = "0.4"
percent-encoding = "2"
mime = "0.3"
futures = "0.3"
bytes = "1"
dotenvy = "0.15"
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "multipart"], default-features = false }

[profile.release]
lto = true
codegen-units = 1